services:
  aquanext-db:
    image: mysql:latest
    container_name: aquanext-db
    ports:
      - 3306:3306
    env_file:
      - ./DataBase/.env
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./DataBase/data:/docker-entrypoint-initdb.d
      - ./DataBase/my.cnf:/etc/mysql/conf.d/custom.cnf
      - ./DataBase/persistent:/var/lib/mysql
      - ./DataBase/CargaDatos:/var/lib/mysql-files
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aquanext-net
    restart: unless-stopped

  aquanext-api:
    image: node:alpine
    container_name: aquanext-api
    ports:
      - 3000:3000
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./BackEnd:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aquanext-net
    command: sh -c "cd /app && npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      - aquanext-db

  aquanext-web:
    image: nginx:alpine
    container_name: aquanext-web
    ports:
      - 80:80
      - 443:443
    environment:
      - TZ=America/Mexico_City
    volumes:
      - ./FrontEnd/dist:/usr/share/nginx/html
      - ./FrontEnd/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt/archive/aquanext.nimbuscloud.mx/:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - aquanext-net
    restart: unless-stopped
    depends_on:
      - aquanext-api

networks:
  aquanext-net:
    external: true
    driver: bridge
